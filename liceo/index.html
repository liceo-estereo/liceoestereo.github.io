<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liceo Tame Stereo</title>
  <meta name="description" content="Emisora institucional del Liceo Tame: programación y noticias del colegio.">
  <link rel="icon" href="logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Jost:wght@500;700&display=swap">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header class="cabecera envoltura">
    <a class="marca" href="./">
      <img src="logo.svg" alt="" width="60" height="60">
      <span class="nombre">Liceo Tame <span>stereo</span></span>
    </a>
    <nav aria-label="Secciones">
      <a href="#seccion-noticias">Noticias</a>
      <a href="#programacion">Programación</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </header>

  <div class="franja">
    <p id="estado" class="envoltura" aria-live="polite"><i aria-hidden="true"></i><span></span></p>
  </div>

  <main class="envoltura">
    <section id="seccion-noticias">
      <h2>Noticias</h2>
      <div id="noticias"></div>
    </section>

    <aside id="programacion">
      <h2>Programación</h2>
      <ul id="parrilla"></ul>
    </aside>
  </main>

  <footer id="contacto">
    <div class="envoltura">
      <p id="lema"></p>
      <p>Para pedir una canción, enviar un saludo o unirte al equipo, escríbenos a <a id="correo"></a>.</p>
      <p class="equipo"><a href="https://app.pagescms.org" rel="noopener">Equipo de la emisora: publicar noticias</a></p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
