<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Administración · Liceo Tame Stereo</title>
  <link rel="icon" href="../img/logo.svg">
  <link rel="stylesheet" href="../css/sitio.css">
  <link rel="stylesheet" href="../css/panel.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
  <script type="module" src="../js/panel.js"></script>
</head>
<body>
  <header class="cabecera">
    <div class="envoltura cabecera-principal">
      <a class="marca" href="../index.html" aria-label="Liceo Tame Stereo, volver al sitio">
        <img src="../img/logo.svg" alt="" width="52" height="52">
        <p class="nombre">Liceo Tame <span>stereo</span></p>
      </a>
      <button id="salir" class="boton" type="button" hidden>Cerrar sesión</button>
    </div>
  </header>

  <main id="contenido" class="envoltura admin">
    <p id="aviso" class="aviso" role="status"></p>

    <section id="entrada" hidden>
      <h1>Administración</h1>
      <form id="form-entrada" class="formulario">
        <label for="correo">Correo</label>
        <input id="correo" name="correo" type="email" autocomplete="username" required>
        <label for="clave">Contraseña</label>
        <input id="clave" name="clave" type="password" autocomplete="current-password" required>
        <button class="boton lleno" type="submit">Entrar</button>
      </form>
    </section>

    <section id="panel" hidden>
      <p class="meta">Sesión de <span id="quien"></span></p>
      <nav class="pestanas" role="tablist" aria-label="Secciones del panel">
        <button type="button" role="tab" data-pestana="noticias">Noticias</button>
        <button type="button" role="tab" data-pestana="vivo">En vivo</button>
        <button type="button" role="tab" data-pestana="tickets">Tickets</button>
        <button type="button" role="tab" data-pestana="mensajes">Mensajes</button>
      </nav>

      <section id="pestana-noticias" role="tabpanel" hidden>
        <h2>Noticias</h2>
      </section>

      <section id="pestana-vivo" role="tabpanel" hidden>
        <h2>En vivo</h2>
      </section>

      <section id="pestana-tickets" role="tabpanel" hidden>
        <h2>Tickets</h2>
      </section>

      <section id="pestana-mensajes" role="tabpanel" hidden>
        <h2>Mensajes</h2>
      </section>
    </section>
  </main>
</body>
</html>
