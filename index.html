<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liceo Tame Stereo</title>
  <meta name="description" content="Emisora institucional del Liceo Tame: noticias, programación, equipo y contacto.">
  <link rel="icon" href="logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Jost:wght@500;700&display=swap">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <!-- La cabecera y el pie se repiten en las cuatro páginas: un cambio en el menú hay que hacerlo en todas. -->
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <header class="cabecera">
    <div class="envoltura">
      <a class="marca" href="index.html" aria-label="Liceo Tame Stereo, inicio">
        <img src="logo.svg" alt="" width="52" height="52">
        <p class="nombre">Liceo Tame <span>stereo</span></p>
      </a>
      <nav aria-label="Principal">
        <ul>
          <li><a href="index.html" aria-current="page">Noticias</a></li>
          <li><a href="programacion.html">Programación</a></li>
          <li><a href="equipo.html">Equipo</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="franja">
    <p id="estado" class="envoltura" role="status"><i aria-hidden="true"></i><span></span></p>
  </div>

  <main id="contenido" class="envoltura">
    <h1>Noticias</h1>
    <div id="noticias"></div>
  </main>

  <footer class="pie">
    <div class="envoltura">
      <section aria-label="La emisora">
        <div class="insignias">
          <img src="escudo.png" alt="Escudo del Liceo Tame" width="71" height="88">
          <img class="logo" src="logo.svg" alt="" width="64" height="64">
          <p class="nombre">Liceo Tame <span>stereo</span></p>
        </div>
        <p id="lema"></p>
      </section>

      <nav aria-labelledby="titulo-pie-secciones">
        <h2 id="titulo-pie-secciones">Secciones</h2>
        <ul>
          <li><a href="index.html" aria-current="page">Noticias</a></li>
          <li><a href="programacion.html">Programación</a></li>
          <li><a href="equipo.html">Equipo</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </nav>

      <section aria-labelledby="titulo-pie-contacto">
        <h2 id="titulo-pie-contacto">Contacto</h2>
        <p>Para pedir una canción, enviar un saludo o unirte al equipo:</p>
        <address><a id="correo"></a></address>
      </section>

      <p class="creditos">Emisora institucional del Liceo Tame.</p>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
